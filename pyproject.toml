[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebench"
version = "0.1.0"
description = "KnowledgeBench - Benchmark fact-store queries: aliases, chains, reverse lookup"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
